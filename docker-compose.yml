version: '3.8'
services:
  kugou-api:
    image: "hly307765464/kugou-music-api:latest"
    container_name: kugou-music-api
    restart: unless-stopped
    environment:
      - platform=lite
    ports:
      - "8542:3000"
    volumes:
      - "/mydocker/KuGouMusicApi/.admin_config.json:/app/.admin_config.json"
      - "/mydocker/KuGouMusicApi/.admin_devices.json:/app/.admin_devices.json"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"