services:
  kugou-api:
    image: "hly307765464/kugou-music-api:latest"
    container_name: kugou-music-api
    restart: unless-stopped
    environment:
      - platform=lite
    ports:
      - "8542:3000"
    volumes:
      - "/mydocker/KuGouMusicApi/data:/app/data"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"